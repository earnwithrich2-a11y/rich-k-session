<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RICH K – WhatsApp Session Generator</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #08090d;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }
    .card {
      background: #111319;
      border: 1px solid rgba(234, 179, 8, 0.25);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(234, 179, 8, 0.1);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .logo-badge {
      width: 60px;
      height: 60px;
      margin: 0 auto 1rem;
      border-radius: 16px;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 1.6rem;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.35rem;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    .input-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      background: #1a1d26;
      border: 1px solid #334155;
      color: #fff;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #eab308;
      box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.2);
    }
    button.btn {
      width: 100%;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: transform 0.1s, filter 0.2s;
    }
    button.btn:active { transform: scale(0.98); }
    button.btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-qr {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: #1a1d26;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 0.8rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-qr:hover {
      border-color: #eab308;
      color: #eab308;
    }

    .divider {
      margin: 1.25rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .divider-line { flex: 1; height: 1px; background: #334155; }
    .divider-text { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 600; }

    .result-box {
      margin-top: 1.5rem;
      background: #1a1d26;
      border: 1px dashed rgba(234, 179, 8, 0.4);
      border-radius: 12px;
      padding: 1.25rem 1rem;
      display: none;
    }
    .code-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.6rem;
      font-weight: 800;
      color: #eab308;
      letter-spacing: 4px;
      margin: 0.5rem 0;
      user-select: all;
    }
    .instruction {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .session-box {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #334155;
      display: none;
    }
    .session-text {
      width: 100%;
      height: 70px;
      background: #0d0f14;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #22c55e;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 0.5rem;
      resize: none;
      word-break: break-all;
    }
    .copy-btn {
      margin-top: 0.5rem;
      background: #334155;
      color: #fff;
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      color: #eab308;
      margin-top: 0.5rem;
    }
    .footer-link {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #64748b;
    }
    .footer-link a {
      color: #eab308;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-badge">RK</div>
    <h1>RICH K SESSION</h1>
    <p class="subtitle">Link your WhatsApp & generate bot session ID</p>

    <div class="input-group">
      <label><i class="fa-brands fa-whatsapp"></i> WhatsApp Number (with country code)</label>
     <input type="tel" id="phoneNumber" placeholder="e.g. 233533682633" />

    </div>

    <button class="btn" id="submitBtn" onclick="requestPairing()">
      <i class="fa-solid fa-key"></i> Get Pairing Code
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <a href="/qr.html" class="btn-qr">
      <i class="fa-solid fa-qrcode"></i> Scan QR Code Instead
    </a>

    <div class="result-box" id="resultBox">
      <p class="instruction">Enter this code on your WhatsApp notification or <strong>Linked Devices → Link with phone number</strong>:</p>
      <div class="code-display" id="pairingCode">----</div>
      <button class="copy-btn" onclick="copyCode()"><i class="fa-regular fa-copy"></i> Copy Code</button>
      <div class="status-badge" id="statusBadge"><i class="fa-solid fa-spinner fa-spin"></i> Waiting for WhatsApp approval...</div>

      <div class="session-box" id="sessionBox">
        <label><i class="fa-solid fa-shield-halved"></i> Your Session ID (Auto-saved)</label>
        <textarea class="session-text" id="sessionInput" readonly></textarea>
        <button class="btn" style="margin-top:0.5rem;" onclick="copySession()"><i class="fa-regular fa-copy"></i> Copy Session ID</button>
      </div>
    </div>

    <div class="footer-link">
      Powered by <a href="https://app.richkaurex.site" target="_blank">RICH-K-MD</a>
    </div>
  </div>

  <script>
    let pollInterval = null;

    async function requestPairing() {
      const phone = document.getElementById('phoneNumber').value.trim();
      const btn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('resultBox');
      const pairingCodeEl = document.getElementById('pairingCode');
      const statusBadge = document.getElementById('statusBadge');
      const sessionBox = document.getElementById('sessionBox');

      if (!phone || phone.length < 9) {
        alert('Please enter your full WhatsApp number including country code (e.g. 233541234567)');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating code...';
      sessionBox.style.display = 'none';

      try {
        const res = await fetch(`/pair?phone=${encodeURIComponent(phone)}`);
        const data = await res.json();

        if (data.error) {
          alert('Error: ' + data.error);
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-key"></i> Get Pairing Code';
          return;
        }

        pairingCodeEl.innerText = data.code;
        resultBox.style.display = 'block';
        statusBadge.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Waiting for you to link in WhatsApp...';

        startPolling(data.id);

      } catch (err) {
        alert('Could not connect to server. Please try again.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-key"></i> Get Pairing Code';
      }
    }

    function startPolling(id) {
      if (pollInterval) clearInterval(pollInterval);

      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`/status?id=${id}`);
          const data = await res.json();

          const statusBadge = document.getElementById('statusBadge');
          const sessionBox = document.getElementById('sessionBox');
          const sessionInput = document.getElementById('sessionInput');
          const btn = document.getElementById('submitBtn');

          if (data.status === 'connected') {
            statusBadge.innerHTML = '<i class="fa-solid fa-circle-check" style="color:#22c55e"></i> Connected! Generating session...';
          }

          if (data.sessionId) {
            clearInterval(pollInterval);
            statusBadge.innerHTML = '<i class="fa-solid fa-check-double" style="color:#22c55e"></i> Success! Sent to WhatsApp & shown below.';
            sessionInput.value = data.sessionId;
            sessionBox.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-key"></i> Get Pairing Code';
          } else if (data.status === 'failed') {
            clearInterval(pollInterval);
            statusBadge.innerHTML = '<span style="color:#ef4444"><i class="fa-solid fa-xmark"></i> Linking canceled or failed. Try again.</span>';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-key"></i> Get Pairing Code';
          }
        } catch (e) {}
      }, 3000);
    }

    function copyCode() {
      const code = document.getElementById('pairingCode').innerText;
      navigator.clipboard.writeText(code);
      alert('Pairing code copied: ' + code);
    }

    function copySession() {
      const sess = document.getElementById('sessionInput').value;
      navigator.clipboard.writeText(sess);
      alert('Session ID copied to clipboard!');
    }
  </script>
</body>
</html>
